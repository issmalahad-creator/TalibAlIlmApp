name: talib_alilm_app
description: "طالب العلم — independent personal study-progress tracker with private monthly reporting."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4
  http: ^1.2.2
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.3
  intl: ^0.20.1
  flutter_pdfview: ^1.3.2
  hijri: ^3.0.1
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  url_launcher: ^6.3.2
  file_picker: ^10.0.0
  audioplayers: ^6.1.0
  excel: ^4.0.6
  share_plus: ^10.1.4
  confetti: ^0.8.0
  adhan_dart: ^2.0.1
  geolocator: ^14.0.2
  flutter_compass: ^0.8.1
  youtube_player_iframe: ^5.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  camera: ^0.11.0+2
  flutter_rotation_sensor: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon_flat.png"
  adaptive_icon_background: "#4E8368"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Quran text (Phase 0 of QURAN_COMPANION_ROADMAP.md) — Tanzil Uthmani text,
  # verbatim per its CC-BY 3.0 license (see the file's own embedded header).
  # Book-of-the-month content itself is still fetched live from Telegram, no
  # asset needed for that. See CLAUDE.md "Book content feed".
  assets:
    - assets/quran/quran-uthmani.txt
    - assets/quran/quran-data.js
    - assets/quran/tafsir-ibn-kathir-full.jsonl.gz
    - assets/quran/tafsir-almukhtasar.jsonl.gz
    - assets/quran/tafsir-muyassar.jsonl.gz
    - assets/quran/tafsir-saadi.jsonl.gz
    - assets/quran/tafsir-ibn_ashur.jsonl.gz
    - assets/quran/tafsir-english_rwwad.jsonl.gz
    - assets/quran/tafsir-amharic_sadiq.jsonl.gz
    - assets/quran/tafsir-french_rashid.jsonl.gz
    - assets/quran/tafsir-turkish_rwwad.jsonl.gz
    - assets/quran/tafsir-indonesian_sabiq.jsonl.gz
    - assets/quran/tafsir-urdu_junagarhi.jsonl.gz
    - assets/quran/tafsir-bengali_zakaria.jsonl.gz
    - assets/quran/tafsir-spanish_garcia.jsonl.gz
    - assets/quran/tafsir-portuguese_nasr.jsonl.gz
    - assets/quran/tafsir-greek_rwwad.jsonl.gz
    - assets/quran/tafsir-german_rwwad.jsonl.gz
    - assets/quran/tafsir-italian_rwwad.jsonl.gz
    - assets/quran/tafsir-bulgarian_translation.jsonl.gz
    - assets/quran/tafsir-romanian_project.jsonl.gz
    - assets/quran/tafsir-dutch_center.jsonl.gz
    - assets/quran/tafsir-swedish_rwwad.jsonl.gz
    - assets/quran/tafsir-azeri_musayev.jsonl.gz
    - assets/quran/tafsir-georgian_rwwad.jsonl.gz
    - assets/quran/tafsir-macedonian_group.jsonl.gz
    - assets/quran/tafsir-albanian_rwwad.jsonl.gz
    - assets/quran/tafsir-bosnian_rwwad.jsonl.gz
    - assets/quran/tafsir-russian_rwwad.jsonl.gz
    - assets/quran/tafsir-belarusian_krivtsov.jsonl.gz
    - assets/quran/tafsir-serbian_rwwad.jsonl.gz
    - assets/quran/tafsir-croatian_rwwad.jsonl.gz
    - assets/quran/tafsir-lithuanian_rwwad.jsonl.gz
    - assets/quran/tafsir-ukrainian_yakubovych.jsonl.gz
    - assets/quran/tafsir-kazakh_altai.jsonl.gz
    - assets/quran/tafsir-uzbek_rwwad.jsonl.gz
    - assets/quran/tafsir-tajik_arifi.jsonl.gz
    - assets/quran/tafsir-kyrgyz_hakimov.jsonl.gz
    - assets/quran/tafsir-circassian_rwwad.jsonl.gz
    - assets/quran/tafsir-tagalog_rwwad.jsonl.gz
    - assets/quran/tafsir-bisayan_rwwad.jsonl.gz
    - assets/quran/tafsir-iranun_sarro.jsonl.gz
    - assets/quran/tafsir-maguindanao_rwwad.jsonl.gz
    - assets/quran/tafsir-malay_basumayyah.jsonl.gz
    # 2026-08-17: temporarily held out (still fetching in the background,
    # see quran_import_service.dart's matching note) so this build isn't
    # blocked on them — re-add the moment the 6 files land in assets/quran/.
    # - assets/quran/tafsir-chinese_suliman.jsonl.gz
    # - assets/quran/tafsir-uyghur_saleh.jsonl.gz
    # - assets/quran/tafsir-japanese_saeedsato.jsonl.gz
    # - assets/quran/tafsir-somali_abduh.jsonl.gz
    # - assets/quran/tafsir-hindi_omari.jsonl.gz
    # - assets/quran/tafsir-luganda_foundation.jsonl.gz
    - assets/hadith/nawawi40.json
    - assets/aqeedah/wasitiyyah.json
    - assets/fiqh_seerah/zad_almaad_vol1.json
    - assets/aqeedah/madarij_part1.json
    - assets/adhkar/hisn_almuslim.json
    # CC0/public domain (see LICENSED_CONTENT_SOURCES.md) — used for the
    # in-app "Test Adhan" preview; the notification-channel sound itself is
    # served from the separate android/app/src/main/res/raw copy, which
    # Android requires as a native resource rather than a Flutter asset.
    - assets/audio/adhan_beautiful.ogg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Amiri / Amiri Quran (SIL Open Font License 1.1, see
  # assets/fonts/AMIRI_QURAN_LICENSE.txt) — proper Uthmani-script rendering
  # for Quran ayah text, was previously falling back to the system font.
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    # Digital Khatt "Madina" (SIL Open Font License 1.1, see
    # assets/fonts/DIGITALKHATT_MADINA_LICENSE.txt) — matches the 1420H
    # Madani Mushaf script, sourced from github.com/DigitalKhatt/madinafont
    # (sponsored by Tarteel AI). Offered as a selectable alternative to
    # AmiriQuran in شاشة القرآن (Ismail's request 2026-08-20), not a
    # replacement — KFGQPC's own Uthmanic Hafs font was checked first and
    # ruled out: its license forbids redistribution without King Fahd
    # Complex's written approval.
    - family: DigitalKhattMadina
      fonts:
        - asset: assets/fonts/DigitalKhattMadina.otf
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
